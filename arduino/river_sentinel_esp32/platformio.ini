; River Sentinel 2.0 - PlatformIO Configuration for ESP32-WROOM-32
; Board Profile: Espressif ESP32 Dev Module (esp32dev)
; Target Architecture: Xtensa Dual-Core 240MHz, 520KB SRAM, 4MB Flash

[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags = 
    -DCORE_DEBUG_LEVEL=0
